<header class="topbar">
  <a class="brand" href="/" aria-label="Caro Anki">CARO <span>ANKI</span></a>
  <div class="topbar-actions">
    <span id="connectionStatus" class="status-pill system-message is-pending">Checking connection</span>
    <button id="ankiAccountOpen" class="button button-quiet button-icon" type="button"
      aria-label="AnkiWeb account — not logged in (Command or Control+Shift+L)"
      aria-keyshortcuts="Meta+Shift+L Control+Shift+L"
      title="AnkiWeb account — not logged in (⌘/Ctrl+Shift+L)">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-user"></use></svg>
    </button>
    <button id="syncAnki" class="button button-quiet button-icon" type="button"
      aria-label="Sync with AnkiWeb (Command or Control+Shift+Y)"
      aria-keyshortcuts="Meta+Shift+Y Control+Shift+Y" title="Sync with AnkiWeb (⌘/Ctrl+Shift+Y)">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-sync"></use></svg>
    </button>
    <button id="ankiSettingsOpen" class="button button-ui button-icon" type="button"
      aria-label="Anki settings (Command or Control+,)"
      aria-keyshortcuts="Meta+, Control+," title="Anki settings (⌘/Ctrl+,)">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-settings"></use></svg>
    </button>
  </div>
</header>
